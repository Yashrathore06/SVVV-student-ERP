<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonafide Certificate | SVVV Student Portal</title>
    <link rel="icon" type="image/svg+xml" href="assets/svvv_logo.svg">
    <!-- Immediate Route Protection & Session Check -->
    <script>
        (function() {
            function checkAuth() {
                try {
                    const rawUser = 
                        localStorage.getItem('user') || 
                        sessionStorage.getItem('user') || 
                        localStorage.getItem('loggedInUser') || 
                        sessionStorage.getItem('loggedInUser') || 
                        localStorage.getItem('currentUser') || 
                        sessionStorage.getItem('currentUser');
                    if (!rawUser) {
                        window.location.replace('login.html');
                        return;
                    }
                    const user = JSON.parse(rawUser);
                    const role = (user && user.role) ? user.role.toUpperCase() : '';
                    if (!user || !role || (role !== 'ROLE_STUDENT' && role !== 'STUDENT')) {
                        window.location.replace('login.html');
                    }
                } catch (e) {
                    window.location.replace('login.html');
                }
            }
            checkAuth();
            window.addEventListener('pageshow', function(event) {
                if (event.persisted || (performance.navigation && performance.navigation.type === 2)) {
                    checkAuth();
                }
            });
        })();

        function handleLogout() {
            // Clear user session from storage
            localStorage.removeItem('user');
            localStorage.removeItem('loggedInUser');
            localStorage.removeItem('currentUser');
            localStorage.removeItem('svvv_user');
            sessionStorage.clear();
            
            // Redirect to login page
            window.location.href = 'login.html';
        }
    </script>
</head>
<body style="font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <div style="text-align:center;">
        <p style="color:#64748b;font-size:0.95rem;">Loading Bonafide Certificate Portal...</p>
    </div>
    <script>
        document.getElementById('logoutBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            handleLogout();
        });
        window.location.replace('student_dashboard.html#bonafide');
    </script>
</body>
</html>
